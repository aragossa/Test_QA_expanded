testing:
  sampling:
    measurements_count: 3
    total_duration_seconds: null
    sampling_frequency_hz: 2

ammeters:
  greenlee:
    port: 5001
    command: "MEASURE_GREENLEE -get_measurement"
    timeout_seconds: 2
  entes:
    port: 5002
    command: "MEASURE_ENTES -get_data"
    timeout_seconds: 2
  circutor:
    port: 5003
    command: "MEASURE_CIRCUTOR -get_measurement -current"
    timeout_seconds: 2

result_management:
  directory: results

bonus:
  visualization:
    enabled: true
    directory: results/plots
  consistency:
    maximum_coefficient_of_variation: 0.1
  accuracy:
    tolerance_percent: 5
    # Accuracy is calculated only when a known reference current is provided.
    reference_currents:
      greenlee: null
      entes: null
      circutor: null
  error_simulation:
    enabled: false
    type: timeout
    fail_on_samples: []
